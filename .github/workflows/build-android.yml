name: Build Android Preview

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS Build profile
        type: choice
        required: true
        default: preview
        options: [preview, development]

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.13.1'

jobs:
  gates:
    name: Preview Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npx expo-doctor
      - run: npx expo export --platform android --clear

  build:
    name: EAS Android Preview
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Validate EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"
      - name: Validate EAS Preview environment
        if: inputs.profile == 'preview'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli@latest env:list --environment preview --format short | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", (chunk) => { input += chunk; });
          process.stdin.on("end", () => {
            const required = [
              "EXPO_PUBLIC_API_BASE_URL",
              "EXPO_PUBLIC_SUPABASE_URL",
              "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
            ];
            const names = new Set(input.split(/\r?\n/).map((line) => line.split("=", 1)[0].trim()));
            for (const name of required) {
              if (!names.has(name)) {
                console.error("Missing required EAS Preview environment variable: " + name);
                process.exitCode = 1;
              }
            }
          });
          '
      - run: npx eas-cli@latest --version
      - name: Build Android with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait
