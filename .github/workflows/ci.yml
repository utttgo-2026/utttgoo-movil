name: CI

on:
  pull_request:
    branches: [main, HRDCORE, eas-google-play]
  push:
    branches: [main, HRDCORE, eas-google-play]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.1'

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npm run doctor

  sdd:
    name: SDD Traceability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify active SDD documents
        run: |
          test -s specs/004-ci-cd/spec.md
          test -s specs/004-ci-cd/plan.md
          test -s specs/004-ci-cd/tasks.md
          grep -q "004-ci-cd" specs/004-ci-cd/spec.md
          grep -q "004-ci-cd" specs/004-ci-cd/plan.md
          grep -q "004-ci-cd" specs/004-ci-cd/tasks.md
