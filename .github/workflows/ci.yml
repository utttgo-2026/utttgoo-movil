name: CI

on:
  pull_request:
    branches: [main, HRDCORE, eas-google-play]
  push:
    branches: [main, HRDCORE, eas-google-play]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.13.1'

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Expo Android export
        run: npx expo export --platform android --clear
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor

  sdd:
    name: SDD Traceability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify active SDD documents
        run: |
          test -s specs/004-ci-cd/spec.md
          test -s specs/004-ci-cd/plan.md
          test -s specs/004-ci-cd/tasks.md
          test "$(basename "$(dirname specs/004-ci-cd/spec.md)")" = "004-ci-cd"
          grep -Eq '^# Specification 004([[:space:]-]|$)' specs/004-ci-cd/spec.md
          grep -Eq '^# Plan 004([[:space:]-]|$)' specs/004-ci-cd/plan.md
          grep -Eq '^# Tasks 004([[:space:]-]|$)' specs/004-ci-cd/tasks.md
